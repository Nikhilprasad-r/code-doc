[project]
name = "codedoc"
version = "0.1.0"
description = "Code documentation assistant: ingest a repository and answer questions about it with cited sources."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "arq>=0.28.0",
    "fastapi>=0.162.0",
    # Code graph (app/ingest/graph.py). Exact pin: graph.json is our contract with it and it releases often;
    # bump deliberately, to a release at least two weeks old, and re-run tests/test_graph.py.
    "graphifyy==0.9.95",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-sdk==1.45.1",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    # 0.26.0 segfaults on linux/aarch64 when traversing trees after many parses; 0.25.2 does not.
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn[standard]>=0.54.0",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs a running Postgres (docker compose up db)"]
